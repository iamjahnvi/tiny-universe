<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Tiny Universe · favicon · small-size optimized -->
  <!-- Dark rounded universe; bold two-arm spiral + concentrated core. -->
  <!-- Thick strokes only — no hairlines, no text, no clutter. -->
  <defs>
    <radialGradient id="tu-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="35%" stop-color="#DDE3FF"/>
      <stop offset="70%" stop-color="#8E97FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8E97FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tu-arm" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E9EDFF"/>
      <stop offset="45%" stop-color="#9AA3FF"/>
      <stop offset="100%" stop-color="#5B3FD6"/>
    </linearGradient>
    <linearGradient id="tu-arm2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E9EDFF"/>
      <stop offset="45%" stop-color="#8E9BFF"/>
      <stop offset="100%" stop-color="#4A34B8"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="15" fill="#05050A"/>
  <!-- subtle inner edge light so it reads on dark tabs -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1"/>

  <g fill="none" stroke-linecap="round">
    <!-- glow underlay -->
    <g opacity="0.55">
      <path d="M32 32 C37 31 41.5 27.5 42.5 22 C43.5 16.5 40 11 34 9.5 C28 8 22 11 20.8 16.5" stroke="#5B54E8" stroke-width="11" opacity="0.5"/>
      <path d="M32 32 C27 33 22.5 36.5 21.5 42 C20.5 47.5 24 53 30 54.5 C36 56 42 53 43.2 47.5" stroke="#4A34B8" stroke-width="11" opacity="0.5"/>
    </g>
    <!-- luminous arms -->
    <path d="M32 32 C37 31 41.5 27.5 42.5 22 C43.5 16.5 40 11 34 9.5 C28 8 22 11 20.8 16.5" stroke="url(#tu-arm)" stroke-width="7"/>
    <path d="M32 32 C27 33 22.5 36.5 21.5 42 C20.5 47.5 24 53 30 54.5 C36 56 42 53 43.2 47.5" stroke="url(#tu-arm2)" stroke-width="7"/>
  </g>

  <!-- dissolving arm tips fade into dark -->
  <circle cx="21" cy="16" r="5" fill="#05050A" opacity="0.55"/>
  <circle cx="43" cy="48" r="5" fill="#05050A" opacity="0.55"/>

  <!-- halo + concentrated core: "something deeper inside" -->
  <circle cx="32" cy="32" r="13" fill="url(#tu-core)" opacity="0.9"/>
  <circle cx="32" cy="32" r="5.2" fill="#F4F6FF"/>
  <circle cx="32" cy="32" r="2.2" fill="#FFFFFF"/>
</svg>
